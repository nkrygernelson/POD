[project]
name = "pod"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.4.1",
    "torchvision==0.19.1",
    "torchaudio==2.4.1",
    "matplotlib>=3.10.9",
    "click>=8.3.3",
    "tqdm>=4.67.3",
    "scikit-learn>=1.8.0",
    "hydra-core>=1.3.2",
]

[tool.uv.sources]
torch = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchvision = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]
torchaudio = [
    { index = "pytorch-cu121", marker = "sys_platform == 'linux'" },
]

[[tool.uv.index]]
name = "pytorch-cu121"
url = "https://download.pytorch.org/whl/cu121"
explicit = true
