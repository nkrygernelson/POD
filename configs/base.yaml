diffusion:
  formulation: noise_prediction   # noise_prediction | score_matching | flow_matching
  timesteps: 1000
  beta_start: 1e-4
  beta_end: 0.02
  beta_schedule: cosine           # linear | cosine

solver:
  name: ddim                      # ddpm | ddim | euler
  num_steps: 50
  eta: 0.0                        # DDIM: 0=deterministic, 1=DDPM

model:
  type: unet
  in_channels: 3
  base_channels: 128
  channel_mults: [1, 2, 4, 8]
  attention_resolutions: [16, 8]

data:
  dataset: cifar10
  image_size: 32
  batch_size: 128
  num_workers: 4

training:
  lr: 2e-4
  max_epochs: 500
  ema_decay: 0.9999
  grad_clip: 1.0
  log_every_n_steps: 100

sample:
  num_samples: 64
  save_dir: samples/
