defaults:
  - schedule: linear
  - solver: deis
  - generation: default
  - t_distribution: uniform_u
  - time_param: identity
  - model: simple
  - dataset: tree
  - sample_io: 2d
  - lr_scheduler: cosine
  - parameterization: clean_pred
  - weight_func : ones
  - prior: standard_normal
  - trainer: default
  - train_proc: standard
  - _self_
  # last, so the experiment overrides everything above (switch with experiment=mnist)
  - experiment: tree
solver_steps: 300
seed: 0
device: cpu
viz: True
run_name: ${now:%Y-%m-%d_%H-%M-%S}
hydra:
  run:
    dir: outputs/${run_name}
  sweep:
    dir: multirun/${run_name}
    subdir: ${hydra.job.num}
