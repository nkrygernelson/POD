schedule:
  _target_: diffusion.schedules.linear.Linear
solver:
  _target_: diffusion.solvers.euler.EulerSolver
  'N': 100
  ti: 1
  tf: 0
generation:
  trained_model_path: trained_models/train_best.pt
model:
  _target_: models.model.SimpleModel
  input_dim: ${input_dim}
  output_dim: ${output_dim}
dataset:
  _target_: data.blob.BlobDataset
  n_samples: 10000
  n_clusters: 4
  cluster_std: 0.3
  random_state: 42
lr_scheduler:
  _target_: torch.optim.lr_scheduler.ReduceLROnPlateau
  mode: min
  factor: 0.1
  patience: 10
parameterization:
  _target_: diffusion.parameterizations.pred.CleanPred
trainer:
  train_split: 0.8
  batch_size: 32
  epochs: 100
  lr: 0.001
  save_final: true
  save_every: 20
seed: 0
device: cpu
input_dim: 2
output_dim: 2
run_name: ${now:%Y-%m-%d_%H-%M-%S}
